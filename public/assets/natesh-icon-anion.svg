<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Center atom nucleus -->
  <circle cx="12" cy="12" r="2" fill="#D4456B" fill-opacity="0.3" stroke="#D4456B" stroke-width="1.2"/>
  <!-- Orbit ellipse 1 (horizontal) -->
  <ellipse cx="12" cy="12" rx="8" ry="3.5" stroke="#D4456B" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <!-- Orbit ellipse 2 (diagonal) -->
  <ellipse cx="12" cy="12" rx="8" ry="3.5" stroke="#D4456B" stroke-width="1.2" stroke-linecap="round" opacity="0.5" transform="rotate(60 12 12)"/>
  <!-- Orbit ellipse 3 (other diagonal) -->
  <ellipse cx="12" cy="12" rx="8" ry="3.5" stroke="#D4456B" stroke-width="1.2" stroke-linecap="round" opacity="0.4" transform="rotate(-60 12 12)"/>
  <!-- Small electron dots -->
  <circle cx="20" cy="12" r="1" fill="#D4456B"/>
  <circle cx="8.2" cy="5.5" r="1" fill="#D4456B" opacity="0.8"/>
  <circle cx="8.2" cy="18.5" r="1" fill="#D4456B" opacity="0.6"/>
</svg>
