  <line x1="50" y1="15" x2="50" y2="88"
        stroke="#9A6B1F" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Feather barbs left -->
  <path d="M50 26 C45 28, 40 30, 37 33" stroke="#9A6B1F" stroke-width="1" stroke-linecap="round" opacity="0.85"/>
  <path d="M50 33 C44 36, 38 38, 35 41" stroke="#9A6B1F" stroke-width="1" stroke-linecap="round" opacity="0.85"/>
  <path d="M50 41 C44 43, 38 46, 36 49" stroke="#9A6B1F" stroke-width="1" stroke-linecap="round" opacity="0.85"/>
  <path d="M50 49 C44 51, 39 53, 37 56" stroke="#9A6B1F" stroke-width="1" stroke-linecap="round" opacity="0.85"/>
  <path d="M50 57 C45 58, 41 60, 40 63" stroke="#9A6B1F" stroke-width="1" stroke-linecap="round" opacity="0.75"/>
  <path d="M50 64 C46 65, 43 67, 43 69" stroke="#9A6B1F" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <!-- Feather barbs right -->
  <path d="M50 26 C55 28, 60 30, 63 33" stroke="#9A6B1F" stroke-width="1" stroke-linecap="round" opacity="0.85"/>
  <path d="M50 33 C56 36, 62 38, 65 41" stroke="#9A6B1F" stroke-width="1" stroke-linecap="round" opacity="0.85"/>
  <path d="M50 41 C56 43, 62 46, 64 49" stroke="#9A6B1F" stroke-width="1" stroke-linecap="round" opacity="0.85"/>
  <path d="M50 49 C56 51, 61 53, 63 56" stroke="#9A6B1F" stroke-width="1" stroke-linecap="round" opacity="0.85"/>
  <path d="M50 57 C55 58, 59 60, 60 63" stroke="#9A6B1F" stroke-width="1" stroke-linecap="round" opacity="0.75"/>
  <path d="M50 64 C54 65, 57 67, 57 69" stroke="#9A6B1F" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <!-- Sparkle 1 — top left of feather tip -->
  <g transform="translate(33, 18)">
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#9A6B1F" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#9A6B1F" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-3" y1="-3" x2="3" y2="3" stroke="#9A6B1F" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
    <line x1="3" y1="-3" x2="-3" y2="3" stroke="#9A6B1F" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- Sparkle 2 — top right small -->
  <g transform="translate(67, 24)">
    <line x1="0" y1="-3.5" x2="0" y2="3.5" stroke="#9A6B1F" stroke-width="1" stroke-linecap="round"/>
    <line x1="-3.5" y1="0" x2="3.5" y2="0" stroke="#9A6B1F" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
