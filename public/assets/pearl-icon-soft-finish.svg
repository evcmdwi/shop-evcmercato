<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Feather body fill (very low opacity) -->
  <path d="M50 15 C60 25, 70 40, 65 60 C60 75, 50 82, 50 82 C50 82, 40 75, 35 60 C30 40, 40 25, 50 15 Z"
        fill="#9A6B1F" fill-opacity="0.07" stroke="none"/>
  <!-- Feather outer left edge -->
